name: Publish to npm

# Publishes claude-code-deepseek-delegator to npm via a Trusted Publisher (OIDC).
# No NPM_TOKEN: GitHub mints a short-lived identity token, npm verifies it against
# the trusted publisher configured on npmjs, and provenance is attached so the npm
# page links back to this exact commit.
#
# DRIFT-PROOF, PUSH-DRIVEN RELEASE:
#   1. bump "version" in package.json
#   2. push to main
# On push, this workflow publishes IFF that version is not already on npm. So the
# published version always equals package.json, and a push without a version bump
# is a no-op. No tags to remember, nothing can drift.
#
# One-time npmjs setup (Trusted Publisher):
#   org/user: 12122J · repo: claude-delegator-deepseek-mcp · workflow: publish.yml

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write # to push the release tag
  id-token: write # REQUIRED for OIDC trusted publishing + provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      - name: Upgrade npm (OIDC trusted publishing needs npm >= 11.5.1)
        run: npm install -g npm@latest

      - name: Run checks (tests + pack dry-run)
        run: npm run check

      - name: Publish if this version is new
        run: |
          PKG="$(node -p "require('./package.json').name")"
          VER="$(node -p "require('./package.json').version")"
          if npm view "$PKG@$VER" version >/dev/null 2>&1; then
            echo "$PKG@$VER is already on npm — nothing to publish."
            exit 0
          fi
          echo "Publishing $PKG@$VER ..."
          npm publish --access public
          # Tag the release in git for the record (provenance already links the commit)
          if ! git rev-parse "v$VER" >/dev/null 2>&1; then
            git tag "v$VER"
            git push origin "v$VER"
          fi
