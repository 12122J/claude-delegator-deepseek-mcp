<svg xmlns="http://www.w3.org/2000/svg" width="860" height="407" viewBox="0 0 860 407" font-family="&quot;SF Mono&quot;, SFMono-Regular, Menlo, Consolas, &quot;Liberation Mono&quot;, monospace" font-size="13">
  <defs>
    <clipPath id="win"><rect x="1" y="1" width="858" height="405" rx="10"/></clipPath>
  </defs>
  <!-- window -->
  <rect x="1" y="1" width="858" height="405" rx="10" fill="#ffffff" stroke="#d0d0d0"/>
  <g clip-path="url(#win)">
    <rect x="0" y="0" width="860" height="44" fill="#f0f0f0"/>
    <line x1="0" y1="44" x2="860" y2="44" stroke="#dcdcdc"/>
  </g>
  <circle cx="26" cy="22" r="6.5" fill="#ff5f57"/>
  <circle cx="48" cy="22" r="6.5" fill="#febc2e"/>
  <circle cx="70" cy="22" r="6.5" fill="#28c840"/>
  <text x="430" y="26" text-anchor="middle" fill="#7a7a7a" font-size="12">javi — claude — 96×20</text>
  <text x="26" y="75" xml:space="preserve"><tspan fill="#0e7490">❯ </tspan><tspan fill="#2d2d2d">audit src/ for security issues (5 files, ~2,400 lines)</tspan></text>
  <text x="26" y="113" xml:space="preserve"><tspan fill="#2d2d2d">&gt; This analyzes ~2,400 lines across 5 files.</tspan></text>
  <text x="26" y="132" xml:space="preserve"><tspan fill="#2d2d2d">&gt; </tspan><tspan fill="#2d2d2d" font-weight="600">Delegate to DeepSeek? (y/n)</tspan></text>
  <text x="26" y="170" xml:space="preserve"><tspan fill="#0e7490">❯ </tspan><tspan fill="#2d2d2d">y</tspan></text>
  <text x="26" y="208" xml:space="preserve"><tspan fill="#188038">  ◆ </tspan><tspan fill="#2d2d2d" font-weight="600">delegated to </tspan><tspan fill="#0e7490">DeepSeek</tspan><tspan fill="#9a9a9a"> (deepseek-v4-flash · read)</tspan></text>
  <text x="26" y="227" xml:space="preserve"><tspan fill="#9a9a9a">    files[] → auth.py · middleware.py · payments.py · sessions.py · api.py</tspan></text>
  <text x="26" y="246" xml:space="preserve"><tspan fill="#9a9a9a">    file bytes go straight to DeepSeek — they never enter Claude’s context</tspan></text>
  <text x="26" y="284" xml:space="preserve"><tspan fill="#9a9a9a">  ⎿ delegate deepseek-v4-flash via deepseek · </tspan><tspan fill="#188038">saved $0.194 (94% vs Opus)</tspan><tspan fill="#9a9a9a"> · spent $0.012 · 38,412 tokens</tspan></text>
  <text x="26" y="322" xml:space="preserve"><tspan fill="#0e7490">● </tspan><tspan fill="#2d2d2d">Found 3 issues worth fixing, ranked by severity:</tspan></text>
  <text x="26" y="341" xml:space="preserve"><tspan fill="#2d2d2d">  1. auth.py:142 — JWT signature not verified on the refresh path</tspan></text>
  <text x="26" y="360" xml:space="preserve"><tspan fill="#2d2d2d">  2. payments.py:88 — amount is taken from the client payload</tspan></text>
  <text x="26" y="379" xml:space="preserve"><tspan fill="#2d2d2d">  3. sessions.py:31 — session id generated with random.random()</tspan></text>
</svg>
