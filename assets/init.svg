<svg xmlns="http://www.w3.org/2000/svg" width="860" height="1053" viewBox="0 0 860 1053" font-family="&quot;SF Mono&quot;, SFMono-Regular, Menlo, Consolas, &quot;Liberation Mono&quot;, monospace" font-size="13">
